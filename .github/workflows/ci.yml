name: CI

on:
  push:
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check --diff .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # zsh is not on the runner by default, and without it the test that
      # syntax-checks the zsh completion script would quietly skip.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build pytest
          python -m build

      - name: Install the built wheel (tests run against the real package)
        run: pip install dist/*.whl

      - name: Run tests
        run: pytest -v

      - name: Smoke test the CLI
        run: |
          barem --version
          barem --list
          barem find size
          barem -s port --oneline | head -5
          barem --completion bash
          barem --completion zsh

      # Source the generated script and drive the completion function the way
      # a TAB press would, so a broken script fails here and not on a user's
      # machine, where completion just silently offers nothing.
      - name: Smoke test bash completion
        shell: bash
        run: |
          source <(barem --completion bash)

          COMP_WORDS=(barem doc) COMP_CWORD=1 COMPREPLY=()
          _barem
          echo "barem doc -> ${COMPREPLY[*]}"
          [[ "${COMPREPLY[*]}" == "docker" ]]

          COMP_WORDS=(barem tar extr) COMP_CWORD=2 COMPREPLY=()
          _barem
          echo "barem tar extr -> ${COMPREPLY[*]}"
          [[ "${COMPREPLY[*]}" == *extract* ]]
