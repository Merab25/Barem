name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build pytest
          python -m build

      - name: Install the built wheel (tests run against the real package)
        run: pip install dist/*.whl

      - name: Run tests
        run: pytest -v

      - name: Smoke test the CLI
        run: |
          gamaxsene --version
          gamaxsene --list
          gamaxsene find size
          gamaxsene -s port --oneline | head -5
