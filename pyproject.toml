[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gamaxsene"
dynamic = ["version"]
description = "Real-world, copy-paste-ready examples for Linux commands, right in your terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Merab" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["linux", "cli", "cheatsheet", "examples", "devops", "terminal"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest", "build"]

[project.urls]
Homepage = "https://github.com/Merab25/Gamaxsene"
Issues = "https://github.com/Merab25/Gamaxsene/issues"

# Creates the `gamaxsene` terminal command -> runs main() in src/gamaxsene/cli.py
[project.scripts]
gamaxsene = "gamaxsene.cli:main"

# Version lives in one place: src/gamaxsene/__init__.py
[tool.hatch.version]
path = "src/gamaxsene/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gamaxsene"]

[tool.pytest.ini_options]
testpaths = ["tests"]
