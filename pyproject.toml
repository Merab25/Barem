[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "barem"
dynamic = ["version"]
description = "Real-world, copy-paste-ready examples for Linux commands, right in your terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Merab" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["linux", "cli", "cheatsheet", "examples", "devops", "terminal"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest", "build", "ruff"]

[project.urls]
Homepage = "https://github.com/Merab25/Barem"
Repository = "https://github.com/Merab25/Barem"
Issues = "https://github.com/Merab25/Barem/issues"
Changelog = "https://github.com/Merab25/Barem/blob/main/CHANGELOG.md"

# Creates the `barem` terminal command -> runs main() in src/barem/cli.py
[project.scripts]
barem = "barem.cli:main"

# Version lives in one place: src/barem/__init__.py
[tool.hatch.version]
path = "src/barem/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/barem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"    # the oldest Python the package supports

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # rewrite to modern syntax the supported Pythons allow
    "B",   # bugbear: likely bugs
    "C4",  # comprehensions
    "SIM", # simplifications
    "SLF", # private member access
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# argparse has no public API for "every option you accept", and completion
# has to know exactly that, so option_names() reads parser._actions.
"src/barem/cli.py" = ["SLF001"]
# These fixtures are literal command output, pasted as it is printed.
# Wrapping those lines would change what is being tested against.
"tests/test_table_parse.py" = ["E501"]
"tests/test_diagnose.py" = ["E501"]
